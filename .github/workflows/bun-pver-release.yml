# Created using @tscircuit/plop (npm install -g @tscircuit/plop)
name: Publish to npm
on:
  push:
    branches:
      - main
    # Workflow-only changes (including this migration) must never publish.
    paths-ignore:
      - ".github/**"
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: Explicitly select a release operation
        default: none
        options:
          - none
          - release
          - recover-0.0.5
      confirmation:
        type: string
        description: Type "publish stepts@0.0.5" for recovery or "release next version"
        default: ""

concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  UPSTREAM_REPOS: "" # comma-separated list, e.g. "eval,tscircuit,docs"
  UPSTREAM_PACKAGES_TO_UPDATE: "" # comma-separated list, e.g. "@tscircuit/core,@tscircuit/protos"

jobs:
  select-operation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.guard.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: guard
        run: node .github/scripts/release-guard.cjs

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: select-operation
    if: needs.select-operation.outputs.mode == 'release'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      # Trusted publishing requires npm >= 11.5.1.
      - run: npm install -g npm@11
      - run: npm install -g pver
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: pver release --no-push-main
        env:
          GITHUB_TOKEN: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}

      - name: Get package version
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: bump version to ${{ steps.package-version.outputs.version }}"
          title: "chore: bump version to ${{ steps.package-version.outputs.version }}"
          body: "Automated package update"
          branch: bump-version-${{ github.run_number }}
          base: main
          token: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
          committer: tscircuitbot <githubbot@tscircuit.com>
          author: tscircuitbot <githubbot@tscircuit.com>

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number != ''
        run: |
          gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --auto --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}

      # - name: Trigger upstream repo updates
      #   if: env.UPSTREAM_REPOS && env.UPSTREAM_PACKAGES_TO_UPDATE
      #   run: |
      #     IFS=',' read -ra REPOS <<< "${{ env.UPSTREAM_REPOS }}"
      #     for repo in "${REPOS[@]}"; do
      #       if [[ -n "$repo" ]]; then
      #         echo "Triggering update for repo: $repo"
      #         curl -X POST \
      #           -H "Accept: application/vnd.github.v3+json" \
      #           -H "Authorization: token ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}" \
      #           -H "Content-Type: application/json" \
      #           "https://api.github.com/repos/tscircuit/$repo/actions/workflows/update-package.yml/dispatches" \
      #           -d "{\"ref\":\"main\",\"inputs\":{\"package_names\":\"${{ env.UPSTREAM_PACKAGES_TO_UPDATE }}\"}}"
      #       fi
      #     done

  recover-0-0-5:
    needs: select-operation
    if: needs.select-operation.outputs.mode == 'recovery'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f159444d7615ccabdfd53a7c8b06f9688675e577
          persist-credentials: false
      - name: Verify immutable recovery source
        run: |
          test "$(git rev-parse HEAD)" = f159444d7615ccabdfd53a7c8b06f9688675e577
          test "$(git ls-remote origin refs/tags/v0.0.5 | cut -f1)" = f159444d7615ccabdfd53a7c8b06f9688675e577
          node -e 'const p = require("./package.json"); if (p.name !== "stepts" || p.version !== "0.0.5") process.exit(1)'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm install -g npm@11
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test
      - name: Verify registry state and publish existing version
        run: |
          # Fetch the whole public package: network/HTTP/JSON failures stop the run.
          # An npm view failure alone is not proof that a version is absent.
          curl --fail --silent --show-error https://registry.npmjs.org/stepts > "$RUNNER_TEMP/stepts-registry.json"
          node - "$RUNNER_TEMP/stepts-registry.json" <<'NODE'
          const fs = require("node:fs")
          const p = JSON.parse(fs.readFileSync(process.argv[2], "utf8"))
          if (p.name !== "stepts" || typeof p.versions !== "object" || p.versions === null || !Object.hasOwn(p.versions, "0.0.4") || Object.hasOwn(p.versions, "0.0.5") || p["dist-tags"]?.latest !== "0.0.4") {
            throw new Error("Registry state changed; recovery requires absent 0.0.5 and latest 0.0.4")
          }
          NODE
          npm publish
